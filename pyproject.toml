[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Provider-neutral LLM gateway with cost and reliability controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
  "redis>=5,<7",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.8,<3",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.5,<1",
  "fakeredis[lua]>=2.23,<3",
]

[project.scripts]
llm-gateway = "llm_gateway.main:run"
llm-gateway-eval = "llm_gateway.evaluation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_gateway*"]
