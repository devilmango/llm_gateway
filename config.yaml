server:
  request_timeout_seconds: 45
  max_retries: 2
  retry_base_delay_seconds: 0.25
  max_concurrent_requests: 100
  database: ${GATEWAY_DATABASE:-./gateway.sqlite3}
  redis_url: ${REDIS_URL:-}

circuit_breaker:
  # Open after consecutive retryable upstream failures; allow one probe after recovery_seconds.
  failure_threshold: 3
  recovery_seconds: 30

routing:
  # `latency_aware` orders configured route candidates by shared EWMA latency and failure rate.
  strategy: primary_first
  # Optional OpenFeature Remote Evaluation Protocol endpoint. A boolean true value
  # selects the route's configured canary; timeout/error/invalid values use the
  # normal primary and fallback order. Context contains application and tenant_id.
  # feature_flags:
  #   enabled: true
  #   base_url: https://flags.example.com
  #   flag_key: llm-gateway-canary
  #   bearer_token_env: OPENFEATURE_OFREP_BEARER_TOKEN
  #   timeout_seconds: 0.5

# Route/application SLO objectives. Per-route and per-application maps override
# defaults; application values take precedence when both are configured.
slos:
  default:
    availability_target: 0.99
    latency_target_ms: 1000
    latency_objective: 0.95
  applications: {}
  routes: {}

# Optional tool-call guardrails. When configured, these apply to every caller;
# tenant/application values may only make the limits more restrictive.
# tool_governance:
#   allowed_tools: [lookup_order, search_policy]
#   max_tool_calls_per_request: 8
#   max_tool_calls_per_minute: 60
#   execution_timeout_seconds: 300
#   require_approval_tools: [delete_account, issue_refund]

security:
  redact_pii: true
  # gateway_api_key_file: /run/secrets/gateway-api-key
  # Configure GATEWAY_API_KEY in the environment to require gateway authentication.
  # For rotating admin credentials, multiple entries may overlap. Disable the old
  # entry after callers have moved to the replacement key.
  # admin_api_keys:
  #   - id: finance-reporting
  #     api_key_file: /run/secrets/finance-reporting-key
  #     api_key_env: GATEWAY_FINANCE_KEY
  #     scopes: [report]
  #   - id: platform-operations
  #     api_key_env: GATEWAY_OPERATIONS_KEY
  #     scopes: [budgets, providers, webhooks, audit]
  #     enabled: true
  # OIDC/JWT admin and client authentication (requires issuer, audience and JWKS URL).
  # oidc:
  #   enabled: true
  #   issuer: https://identity.example.com/
  #   audience: llm-gateway
  #   jwks_url: https://identity.example.com/.well-known/jwks.json
  #   algorithms: [RS256]

# Optional tenant credentials scope logical routes and application-level policies.
# Use api_key_env for environment-injected credentials, or secret_file for a mounted
# secret file. Secret files are re-read on each authentication check and provider call.
# tenants:
#   support-team:
#     secret_file: /run/secrets/support-team-gateway-key
#     allowed_routes: [simple]
#     allowed_providers: [openai, gemini]
#     allowed_models: [gpt-4o-mini, gemini-2.0-flash]
#     allowed_regions: [us]
#     allowed_tools: [lookup_order, search_policy]
#     data_policy:
#       usage_retention_days: 90
#     default_policy:
#       max_requests_per_minute: 120
#       max_completion_tokens: 1000
#       max_tool_calls_per_request: 4
#       max_tool_calls_per_minute: 20
#     applications:
#       support-router:
#         monthly_limit_usd: 50

# Application budgets and quotas are enforced only when configured for the app
# or under `default`. Monthly windows are UTC calendar months.
budgets:
  default:
    monthly_limit_usd: null
    max_requests_per_minute: null
  applications:
    support-router:
      monthly_limit_usd: 100
      max_requests_per_minute: 300
      max_input_bytes: 32768
      max_completion_tokens: 1024
      alert_thresholds: [0.8, 1.0]
      # Optional JSON webhook POST for each newly crossed alert threshold.
      # alert_webhook_url: https://alerts.example.com/llm-gateway
      # alert_webhook_secret_env: LLM_BUDGET_WEBHOOK_SECRET

providers:
  openai:
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    # Optional invoice correlation overrides; the body field path is dot-separated.
    # request_id_header: X-Invoice-Request
    # request_id_body_field: metadata.gateway_request_id
    # Stable catalog ID; version can be set per model or inherited from this provider.
    pricing_catalog: openai-public-usd
    # Tag the configured deployment's data-processing region for tenant policy checks.
    # data_region: us
    requests_per_minute: 600
    models:
      gpt-4o-mini:
        pricing_version: "2026-10-13"
        input_cost_per_1m: 0.15
        output_cost_per_1m: 0.60
      gpt-4o:
        input_cost_per_1m: 2.50
        output_cost_per_1m: 10.00
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    requests_per_minute: 300
    models:
      claude-3-5-haiku-latest:
        input_cost_per_1m: 0.80
        output_cost_per_1m: 4.00
      claude-3-7-sonnet-latest:
        input_cost_per_1m: 3.00
        output_cost_per_1m: 15.00
  gemini:
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GOOGLE_API_KEY
    requests_per_minute: 300
    models:
      gemini-2.0-flash:
        input_cost_per_1m: 0.10
        output_cost_per_1m: 0.40
  local:
    kind: openai
    base_url: http://localhost:11434/v1
    api_key_env: LOCAL_LLM_API_KEY
    api_key_optional: true
    requests_per_minute: 120
    models:
      llama3.1:8b:
        input_cost_per_1m: 0
        output_cost_per_1m: 0
  # Additional adapter examples. Add entries here and reference them from routes.
  # azure:
  #   kind: azure_openai
  #   base_url: https://my-resource.openai.azure.com
  #   api_version: 2024-10-21
  #   api_key_env: AZURE_OPENAI_API_KEY
  #   models: {deployment-name: {input_cost_per_1m: 1, output_cost_per_1m: 2}}
  # bedrock:
  #   kind: bedrock
  #   region: us-east-1
  #   models: {anthropic.claude-3-5-sonnet: {input_cost_per_1m: 3, output_cost_per_1m: 15}}
  # vertex:
  #   kind: vertex
  #   project_id: my-project
  #   region: us-central1
  #   access_token_env: GOOGLE_CLOUD_ACCESS_TOKEN
  #   models: {gemini-2.5-flash: {input_cost_per_1m: 0.3, output_cost_per_1m: 2.5}}
  # vllm:
  #   kind: vllm
  #   base_url: http://localhost:8000/v1
  #   api_key_optional: true
  #   models: {Qwen/Qwen3-8B: {input_cost_per_1m: 0, output_cost_per_1m: 0}}

routes:
  simple:
    model: gpt-4o-mini
    provider: openai
    # Optional deterministic canary sample. Canary traffic bypasses response cache.
    # canary: {provider: anthropic, model: claude-3-5-haiku-latest, traffic_percent: 5}
    fallbacks:
      - provider: gemini
        model: gemini-2.0-flash
    cache:
      enabled: true
      ttl_seconds: 60
  reasoning:
    model: claude-3-7-sonnet-latest
    provider: anthropic
    fallbacks:
      - provider: openai
        model: gpt-4o
    cache:
      enabled: false
  local:
    model: llama3.1:8b
    provider: local
    fallbacks: []
    cache:
      enabled: true
      ttl_seconds: 30
